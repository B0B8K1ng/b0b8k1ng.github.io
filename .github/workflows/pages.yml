name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://b0b8k1ng.github.io/OpenNWM/
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare OpenNWM site
        run: |
          mkdir -p _site/OpenNWM _site/OpenNWM-website
          cp -R *.html *.css *.js assets content .nojekyll _site/OpenNWM/
          touch _site/.nojekyll
          printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/OpenNWM/"><title>OpenNWM</title></head><body><a href="/OpenNWM/">OpenNWM</a></body></html>' > _site/index.html
          cp _site/index.html _site/OpenNWM-website/index.html
      - name: Publish active gallery media and keep archived masters outside Pages
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path, PurePosixPath
          from urllib.parse import urlsplit
          import re

          site = Path('_site/OpenNWM')
          inline = re.search(r'<script\b[^>]*\bid="media-delivery-config"[^>]*>(.*?)</script>', (site / 'index.html').read_text(), re.S)
          assert inline, 'Missing inline media delivery configuration'
          assert json.loads(inline.group(1)) == json.loads((site / 'content/media-delivery.json').read_text()), 'Inline media delivery configuration is stale'
          clips = json.loads((site / 'content/go2.json').read_text())['clips']
          review = json.loads((site / 'assets/go2/privacy-review.json').read_text())
          assert review['status'] == 'passed' and review['selection_preserved']
          reviewed = {row['id']: row for row in review['clips']}
          assert set(reviewed) == {clip['id'] for clip in clips}
          for clip in clips:
              assert clip['privacy']['reviewed']
              assert all(clip[key] == reviewed[clip['id']][key] for key in ('video', 'poster'))
          active_media = {clip[key] for clip in clips for key in ('video', 'poster')}
          # Superseded originals stay in source history; Pages serves only the
          # privacy-reviewed videos and posters selected by the current gallery.
          for path in (site / 'assets/go2').rglob('*'):
              if path.is_file() and path.suffix in {'.mp4', '.webp'} and path.relative_to(site).as_posix() not in active_media:
                  path.unlink()
          for clip in clips:
              if not clip.get('fallback_video'):
                  continue
              relative = PurePosixPath(clip['video'])
              fallback = urlsplit(clip['fallback_video'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[:2] == ('assets', 'go2') and relative.suffix == '.mp4'
              assert fallback.scheme == 'https' and fallback.netloc == 'raw.githubusercontent.com'
              assert re.fullmatch(r'/B0B8K1ng/b0b8k1ng.github.io/[0-9a-f]{40}/' + re.escape(str(relative)), fallback.path)
              (site / relative).unlink()
          total = sum(p.stat().st_size for p in Path('_site').rglob('*') if p.is_file())
          assert total < 950_000_000, f'Pages artifact is too large: {total} bytes'
          print(f'Pages artifact: {total:,} bytes; masters retained in the pinned source archive')
          PY
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
